<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Quick Prompts · test host</title><style>
body{margin:0;background:#f7f8fa;color:#1e293b;font:14px system-ui,sans-serif}main{max-width:900px;margin:80px auto;padding:0 30px}.host-title{font-size:13px;color:#64748b;margin-bottom:14px}.host-placeholder{height:160px;padding:32px;font-size:22px;font-weight:600}.host-composer{border:1px solid #dce1e6;background:white;border-radius:16px;padding:16px}.host-composer>textarea{display:block;width:100%;box-sizing:border-box;min-height:100px;resize:vertical;border:0;font:14px/1.7 system-ui;outline:none;color:#1e293b;background:transparent}.host-tools{display:flex;align-items:center;gap:12px;margin-top:8px}.host-tools>span{margin-left:auto;color:#64748b;font-size:12px}.host-controls{margin-bottom:24px;display:flex;gap:8px}.host-controls button{background:white;border:1px solid #ddd;border-radius:6px;padding:6px 9px}.host-attachment{font-size:11px;color:#64748b}.dark{background:#13171c;color:#e2e8f0;--dsw-alias-bg-layer-1:#1d232b;--dsw-alias-bg-layer-2:#28313c;--dsw-alias-label-primary:#e2e8f0;--dsw-alias-label-secondary:#a1afbf;--dsw-alias-border-l1:#35404d;--dsw-alias-brand-primary:#249e94}.dark .host-composer,.dark .host-controls button{background:#1d232b;border-color:#35404d;color:#e2e8f0}.dark textarea{color:#e2e8f0}
/* DSH's neutral primary changes to a light fill with dark text in dark mode. */
body{--dsw-alias-brand-primary:#0f1115;--dsw-alias-button-primary-fill:var(--dsw-alias-brand-primary);--dsw-alias-button-primary-hover:#43454a;--dsw-alias-label-primary-foreground:#fff}
body.dark{--dsw-alias-brand-primary:#f9fafb;--dsw-alias-button-primary-hover:#e4e6e9;--dsw-alias-label-primary-foreground:#0f1115}
/* Match DSH's full-width dock and independently centered composer card. */
.host-stage{--dsh-composer-side-clearance:16px;--dsh-composer-card-max-width:680px;width:100%}
.host-input-bar{box-sizing:border-box;display:flex;justify-content:center;padding:0 var(--dsh-composer-side-clearance)}
.host-composer{box-sizing:border-box;width:100%;max-width:var(--dsh-composer-card-max-width)}
</style><main id="root"></main><script src="/host.js"></script><script src="/client.js"></script></html>
